    <meta charset="utf-8" />

    <meta name="theme-color" content="#000000" />

    />
    <meta name=”apple-mobile-web-app-capable” content=”yes”>
    <link rel="apple-touch-icon" href="logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>DragnCards</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MY4HHNLSYB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MY4HHNLSYB');
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- overflow:clip (not hidden): hidden is still a scroll container the browser
         can scroll programmatically (scrollIntoView / scroll-anchoring), which in
         the dnc3d engine shifts the whole app up when a card dropped near the
         viewport edge animates its flip. clip clips identically but is never
         scrollable, so the table can't drift. -->
    <div id="root" class="flex flex-col max-w-full h-full" style="height:100dvh;overflow:clip"></div>
